<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Accent glow orb -->
  <circle cx="1020" cy="180" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle cx="180" cy="90" r="100" fill="#06b6d4" opacity="0.10" filter="url(#glow)" />

  <!-- Left Icon Group -->
  <g transform="translate(90, 80)">
    <!-- Outer rounded badge -->
    <rect width="200" height="200" rx="44" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="3" />
    
    <!-- Cat Ears on top of icon -->
    <polygon points="50,55 75,22 98,55" fill="#38bdf8" />
    <polygon points="102,55 125,22 150,55" fill="#38bdf8" />
    
    <!-- Smart Dome / Litter Box outline -->
    <path d="M 50 142 C 50 85, 150 85, 150 142 Z" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
    <ellipse cx="100" cy="132" rx="38" ry="26" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="4" />
    
    <!-- Glowing Status Indicator -->
    <circle cx="100" cy="85" r="7" fill="#10b981" />
    <circle cx="100" cy="85" r="12" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6" />

    <!-- WiFi / Home Assistant signal curves -->
    <path d="M 40 165 Q 100 188 160 165" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Text Section -->
  <g transform="translate(330, 105)">
    <!-- Tagline Badge -->
    <rect x="0" y="0" width="245" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">HOME ASSISTANT INTEGRATION</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">
      FurryTail <tspan fill="url(#primaryGrad)">Home</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Automated litter box controls, pet weight telemetry &amp; smart home routines.
    </text>

    <!-- Feature Pill Tags -->
    <g transform="translate(0, 160)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="34" rx="8" fill="#334155" />
      <text x="67" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🐱 Pet Health</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="135" height="34" rx="8" fill="#334155" />
      <text x="212" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Auto Clean</text>

      <!-- Pill 3 -->
      <rect x="290" y="0" width="135" height="34" rx="8" fill="#334155" />
      <text x="357" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">💡 Night Light</text>

      <!-- Pill 4 -->
      <rect x="435" y="0" width="155" height="34" rx="8" fill="#334155" />
      <text x="512" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🤖 Robot Automations</text>
    </g>
  </g>
</svg>
